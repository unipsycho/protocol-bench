[package]
name = "pb-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Protocol Bench egui desktop shell"

[[bin]]
name = "protocol-bench"
path = "src/main.rs"

[dependencies]
pb-engine = { workspace = true }
pb-ipc = { workspace = true }
pb-points = { workspace = true }
pb-modbus = { workspace = true }
pb-signal = { workspace = true }
pb-expr = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
ureq = { version = "2.12", features = ["json"] }
# Native open/save; spawned off the UI thread (Hyprland stalls if blocking).
rfd = "0.15"

[dev-dependencies]
pb-extkit = { workspace = true }
