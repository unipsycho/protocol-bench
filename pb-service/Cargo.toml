[package]
name = "pb-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Protocol Bench always-on service (packs, project, localhost IPC)"

[[bin]]
name = "pb-service"
path = "src/main.rs"

[dependencies]
pb-engine = { workspace = true }
pb-points = { workspace = true }
pb-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ctrlc = { workspace = true }
directories = { workspace = true }

# Status-area tray (StatusNotifierItem over D-Bus; no GTK). Linux only for now.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "tokio"] }
