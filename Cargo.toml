[workspace]
resolver = "2"
members = ["pb-engine", "pb-ui"]
default-members = ["pb-ui"]

# m17-rust-check/ is a separate crate and is not a workspace member.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Agile Automation / Mike King <mike@agileautomation.ca>"]
publish = false

[workspace.dependencies]
pb-engine = { path = "pb-engine" }
eframe = { version = "0.29", default-features = true }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
