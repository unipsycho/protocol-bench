[workspace]
resolver = "2"
members = [
    "pb-abi",
    "pb-points",
    "pb-engine",
    "pb-mqtt",
    "pb-service",
    "pb-ui",
]
default-members = ["pb-ui"]

# m17-rust-check/ is a separate crate and is not a workspace member.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Agile Automation / Mike King <mike@agileautomation.ca>"]
publish = false

[workspace.dependencies]
pb-abi = { path = "pb-abi" }
pb-points = { path = "pb-points" }
pb-engine = { path = "pb-engine" }
pb-mqtt = { path = "pb-mqtt" }
eframe = { version = "0.29", default-features = true }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.8"
# websocket = MQTT over WS/WSS; use-rustls is rumqttc default (TLS + WSS).
rumqttc = { version = "0.24", features = ["websocket", "use-rustls"] }
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
